services:
    mysql:
        image: mysql:8.4
        container_name: mysql-dev
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: r505_db
            MYSQL_USER: r505_user
            MYSQL_PASSWORD: e66XDTrE
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-uroot",
                    "-proot",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    mysql_data:
